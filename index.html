<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Soccer Shot</title>
  <link rel="icon" href="data:,">
  <link rel="preload" href="fonts/LilitaOne-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    /* Lilita One — SIL Open Font License, see fonts/OFL.txt */
    @font-face {
      font-family: 'Lilita One';
      src: url('fonts/LilitaOne-Regular.woff2') format('woff2');
      font-display: block;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #161d45;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, system-ui, sans-serif;
    }
    canvas {
      display: block;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
